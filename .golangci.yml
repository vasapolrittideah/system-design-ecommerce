version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
    - wastedassign

  settings:
    depguard:
      rules:
        # --------------------------------------------------------------------
        # internal/domain imports libraries, never layers, and shares no code
        # with another service.
        #
        # Half of what people expect this rule to do is already done by the Go
        # compiler and needs no linter: port, app, and adapter all import
        # domain, so an import pointing back at any of them is an import cycle
        # and does not build. Inward dependencies are therefore free. What
        # depguard adds is the other direction — imports pointing *out*, at
        # this repo's own pkg/ and at third-party infrastructure, which compile
        # perfectly well and are exactly what hexagonal forbids.
        #
        # The line drawn is between a library and a layer, not between
        # first-party and third-party code:
        #
        #   - A library has no domain semantics and nobody here can change it.
        #     The standard library is one; so is google/uuid, which implements
        #     an RFC that was frozen years ago. Importing one couples this
        #     package to nothing that will ever move underneath it, and it is
        #     why domain may use time, crypto/sha256, and a UUID generator
        #     without any of them being smuggled in behind a port.
        #
        #   - A layer is anything that reaches the world — pgx, grpc, kafka,
        #     and nearly all of pkg/, which today pulls pgxpool, otel,
        #     Prometheus, and net/http behind eight of its ten packages.
        #
        # pkg/ is denied even where a particular package looks harmless,
        # because "harmless" is a judgment that has to be made again on every
        # pull request, and because a package we own can grow: today's UUID
        # helper is next quarter's shared Money type, and by then two services
        # import it and changing it for one changes it for both. A shared
        # domain concept is the thing this rule exists to prevent, and it
        # arrives disguised as a utility.
        #
        # The price is real: identical code is copied per service wherever a
        # library does not already exist. That is the right trade where two
        # services diverging would harm nobody. Where divergence would instead
        # be a *bug* — two services rounding money differently — the answer is
        # a deliberate shared kernel with an owner and a policy for changing
        # it, argued as an architecture decision, never one more line in
        # `allow` below.
        #
        # `allow` is a whitelist: anything not listed is denied, so this rule
        # needs no maintenance as new libraries enter the repo. If a domain
        # package is ever split into sub-packages, add its import path here.
        # --------------------------------------------------------------------
        domain-stdlib-only:
          list-mode: strict
          files:
            - "**/internal/domain/**"
            # Test files are excluded because they are not part of the package
            # the rule protects: `go build` never compiles them, so nothing they
            # import can reach a binary. A domain test is also written as an
            # external test package, which has to import the package under test
            # — under the rule that import is the domain depending on itself.
            - "!**/*_test.go"
          allow:
            - $gostd
            # An RFC 9562 implementation and nothing else. It is here so that
            # identifier minting is not hand-written once per service — the
            # version and variant bit-twiddling is exactly the kind of code
            # that is easy to get subtly wrong and impossible to notice.
            #
            # Adding to this list is a decision about one library, not a
            # precedent: what qualifies is that it carries no domain meaning
            # and that nobody in this repo can change it.
            - github.com/google/uuid
          deny:
            - pkg: github.com/vasapolrittideah/system-design-ecommerce/pkg
              desc: domain imports libraries, not layers, and pkg/ is layers; copy the helper into this service, and declare error kinds structurally with ErrorKind() string rather than importing errorx
            - pkg: github.com/vasapolrittideah/system-design-ecommerce/gen
              desc: domain must not depend on generated proto; adapters map proto to domain
            - pkg: google.golang.org/grpc
              desc: domain is transport-agnostic
            - pkg: google.golang.org/protobuf
              desc: domain is transport-agnostic
            - pkg: github.com/jackc/pgx/v5
              desc: domain is persistence-agnostic
            - pkg: github.com/segmentio/kafka-go
              desc: domain is messaging-agnostic

        # --------------------------------------------------------------------
        # pkg/ is cross-cutting infrastructure — no business logic.
        # --------------------------------------------------------------------
        pkg-no-service-imports:
          files:
            - "**/pkg/**"
          deny:
            - pkg: github.com/vasapolrittideah/system-design-ecommerce/services
              desc: pkg/ must stay free of business logic; move the shared piece into pkg/ or keep it inside the service

        # --------------------------------------------------------------------
        # Services speak gRPC; the HTTP layer belongs to a BFF.
        #
        # The exception is a prefix rather than a list, which is the whole
        # reason these are named bff-<audience>: screens belong to an audience,
        # so a second one arrives as bff-admin and needs no edit here. A service
        # that grows an HTTP handler is either the wrong place for it or a BFF
        # that was not named like one.
        # --------------------------------------------------------------------
        services-no-httpx:
          files:
            - "**/services/**"
            - "!**/services/bff-*/**"
          deny:
            - pkg: github.com/vasapolrittideah/system-design-ecommerce/pkg/httpx
              desc: httpx is a BFF's HTTP layer; services expose gRPC and let errorx carry their errors

        # --------------------------------------------------------------------
        # Repo-wide bans.
        # --------------------------------------------------------------------
        all:
          files:
            - $all
            - "!$test" # a test may reach for log or a throwaway helper
          deny:
            - pkg: github.com/pkg/errors
              desc: use the standard errors package with pkg/errorx
            - pkg: github.com/sirupsen/logrus
              desc: logging is zap through pkg/logger — never a second logging library
            - pkg: log
              desc: use pkg/logger; logger.From(ctx) in request-scoped code
            - pkg: io/ioutil
              desc: deprecated; use io and os

    errcheck:
      check-type-assertions: true

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        # Config structs are passed by value on purpose — config.MustLoad[T]
        # yields a value and every MustNew in pkg/ takes one.
        - hugeParam
        # A trailing `defer conn.Close()` survives the next line added below it.
        - unnecessaryDefer

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow # `err` shadowed inside a narrower scope is idiomatic Go

    misspell:
      # No locale: the prose here is British on purpose ("behaviour",
      # "localised") and only genuine typos should be reported.
      ignore-rules:
        - statuser # the Go -er interface suffix, not a typo for "stature"

    revive:
      rules:
        - name: exported
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: indent-error-flow
        - name: range-val-address
        - name: unexported-return
        - name: unreachable-code
        - name: var-naming

  exclusions:
    generated: lax
    paths:
      - gen/go
    rules:
      # Closing a body or a conn in a test is noise, not a leak. Test helper
      # packages are held to the same relaxed standard, which is what makes the
      # pkg/<x>/<x>test/ naming worth keeping to — the pattern below is how the
      # rule finds them.
      - path: (_test\.go|/[a-z]+test/)
        linters:
          - bodyclose
          - errcheck
          - gosec
          - noctx
          - unparam
      # A listener is created once at startup; ListenConfig buys nothing there.
      - linters:
          - noctx
        text: net\.Listen must not be called
      # Jitter is not a security decision — math/rand is the right tool.
      - path: pkg/grpcx/client/retry\.go
        linters:
          - gosec
        text: G404
      # Generated mocks are not ours to lint.
      - path: mocks?/
        linters:
          - revive
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vasapolrittideah/system-design-ecommerce
  exclusions:
    generated: lax
    paths:
      - gen/go

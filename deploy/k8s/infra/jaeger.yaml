# Jaeger all-in-one: collector, storage, and UI in one pod, with traces held
# in memory. Restarting it loses every trace, which is the right trade for a
# laptop and completely wrong anywhere else.
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    # What OBS_OTLP_ENDPOINT points at. Services speak OTLP/gRPC; Tempo takes
    # the same protocol on the same port, so swapping backends is a hostname.
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: ui
      port: 16686
      targetPort: ui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.65.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: ui
              containerPort: 16686
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: ui
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
# The collector takes spans from any pod in the namespace, which is the one
# ingress rule here that is deliberately wide: every process in this repo is
# expected to export traces, and a service that could not would be diagnosed as
# a missing span rather than as a refused connection.
#
# The UI is Grafana's, through the tracesToMetrics link in its datasources, and
# a person's through `make port-forward`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4317
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 16686

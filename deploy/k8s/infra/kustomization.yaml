apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dependencies every service shares. Kafka (KRaft) joins this list as the phase
# that needs it arrives — an unused broker on a laptop is a gigabyte of RAM and
# a pod that is red for no reason.
#
# Kong is here rather than under base/ and overlays/ because it is a dependency
# and not a service: nothing in this repo builds its image, so it belongs beside
# Jaeger and Reloader.
#
# This directory is a base, and it is not applied on its own. Everything in it
# is described once and holds no value naming a cluster; what does is
# overlays/<env>/infra, which `make up OVERLAY=<env>` applies. The gateway's
# allowed browser origin is the whole of that today, and prod adds the tunnel
# that puts the cluster on the internet.
#
# Databases are not here. Each service runs its own Postgres instance, declared
# in its own local overlay, because an instance serving exactly one service is
# that service's dependency rather than shared infrastructure — and a shared
# instance is the arrangement that quietly becomes a shared database.

# namespace.yaml is deliberately not listed. It is applied on its own by
# `make up`, so that `make down` can remove the workloads without taking the
# namespace — and with it every PersistentVolumeClaim — down as well. Throwing
# away the database is `make clean-volumes`, and it should take a second
# command to say so.
resources:
  - alloy
  - grafana
  - jaeger
  - kong
  - loki
  - prometheus
  - reloader

namespace: ecommerce

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: ecommerce
      app.kubernetes.io/component: infra

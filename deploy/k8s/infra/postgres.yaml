# One Postgres instance for local development, with a separate role and
# database per service created at init time.
#
# Database-per-service is enforced by the server, not by convention: each
# service connects as its own role, which owns its own database and can reach
# nothing else. A service that tries to read another's tables gets a
# permission error on a laptop, long before anyone argues about it in review.
#
# This file is local infrastructure only. A real deployment uses a managed
# instance per service and never a StatefulSet copied out of here.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
data:
  # Runs once, on an empty data directory. Adding a service later means
  # editing this and recreating the volume — `make clean-volumes`.
  01-databases.sql: |
    CREATE ROLE identity LOGIN PASSWORD 'identity';
    CREATE DATABASE identity OWNER identity;
---
# Headless, because a StatefulSet needs a governing service and nothing here
# benefits from a virtual IP. `kubectl port-forward svc/postgres` works either
# way, which is how a host-run service reaches it.
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          # Pinned to the same image pkg/postgres/postgrestest starts under
          # testcontainers, so a query that passes in a test behaves the same
          # against the local stack.
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            # The image only runs initdb scripts when it creates the cluster,
            # and it needs this to put the data one level down from the mount
            # point — a PVC root already contains lost+found on some drivers.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

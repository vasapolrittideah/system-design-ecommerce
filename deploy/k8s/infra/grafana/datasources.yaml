# Datasources as files rather than as clicks. Grafana reads this at startup and
# on every restart, so the connection details are reviewable and a pod that is
# deleted comes back knowing where its data is.
apiVersion: 1

# Named the same on every restart, so a dashboard can reference a datasource by
# uid instead of by whatever id an import happened to assign.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
      # What makes a latency panel clickable. Prometheus stores the trace ID
      # that pkg/httpx and pkg/grpcx/server hang off each sampled observation;
      # this is the half that turns it into a link into Jaeger.
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger

  - name: Jaeger
    uid: jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    jsonData:
      # The other direction: from a span, jump to the RED metrics of the service
      # that produced it. `service` is the label pkg/observability puts on every
      # series and the resource attribute it puts on every span, which is what
      # lets one name work on both sides.
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service
        queries:
          - name: "Request rate"
            query: 'sum by (grpc_method, route) (rate({__name__=~"grpc_server_handled_total|http_server_handled_total", $$__tags}[5m]))'
      # From a span to the lines the same request wrote. filterByTraceID adds
      # the trace ID as a line filter, which works because pkg/logger puts
      # trace_id on every request-scoped line — and it is why the query needs no
      # label for it, the one label that would be ruinous to index.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        tags:
          - key: service.name
            value: service

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # The return leg of the link above: a trace ID in a log line becomes a
      # link into Jaeger. Grafana reads it out of the raw line rather than out
      # of a label, so this regex is the coupling — it matches the field
      # pkg/logger writes, and renaming that field breaks the link silently.
      #
      # The optional whitespace is what makes it work under both encoders: zap's
      # json encoder writes `"trace_id":"..."` and its console encoder writes
      # `"trace_id": "..."`, and the local overlays run the second one.
      derivedFields:
        - name: trace_id
          matcherType: regex
          matcherRegex: '"trace_id":\s*"(\w+)"'
          url: '${__value.raw}'
          datasourceUid: jaeger

apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  annotations:
    # loki.yaml is a mounted ConfigMap read at startup. Without this, an edited
    # retention bound applies to nothing until somebody deletes the pod.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the index and chunks are an emptyDir owned by
  # one pod, and a surge replica would come up claiming the same ring and
  # writing a second, shorter history for however long the rollout takes.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
    spec:
      securityContext:
        runAsNonRoot: true
        # The uid the image's files are owned by.
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          # The 3.5 line, which still takes backported patches while 3.6 and 3.7
          # move. This is infrastructure nobody wants to spend a morning
          # bumping, and the query language a dashboard is written against
          # should not move underneath it — the same reason Prometheus is
          # pinned to its LTS.
          image: grafana/loki:3.5.12
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - name: http
              containerPort: 3100
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
            # The root filesystem is read-only, as everywhere else here, and the
            # querier writes its intermediate results to a temp directory.
            - name: tmp
              mountPath: /tmp
          # /ready is the process with its ingester joined to the ring. As
          # everywhere else here, liveness must not use it: an ingester replaying
          # its WAL slowly would otherwise be restarted into replaying it again.
          startupProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 2
            failureThreshold: 45
          livenessProbe:
            httpGet:
              path: /metrics
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              # Memory only, as everywhere else here. A CPU limit would throttle
              # ingestion during exactly the incident the logs exist for, and a
              # push Loki rejects is a log line nobody gets back.
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}

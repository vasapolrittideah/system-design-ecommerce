apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace and no shared labels here: the infra kustomization that includes
# this directory sets both, the same way it does for every other dependency.

resources:
  - rbac.yaml
  - daemonset.yaml

# A fixed name, as everywhere else in this repo. Kustomize's content hash would
# roll the DaemonSet by renaming the object, but it gets there by creating a new
# ConfigMap on every edit and orphaning the last one, with nothing to remove
# them. The Reloader annotation on the DaemonSet does the restart instead.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: alloy-config
    files:
      - config.alloy

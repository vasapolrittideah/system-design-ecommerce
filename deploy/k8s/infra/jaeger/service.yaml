apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    # What OBS_OTLP_ENDPOINT points at. Services speak OTLP/gRPC; Tempo takes
    # the same protocol on the same port, so swapping backends is a hostname.
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: ui
      port: 16686
      targetPort: ui

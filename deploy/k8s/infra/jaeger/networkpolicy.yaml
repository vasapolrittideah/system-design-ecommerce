# The collector takes spans from any pod in the namespace, which is the one
# ingress rule here that is deliberately wide: every process in this repo is
# expected to export traces, and a service that could not would be diagnosed as
# a missing span rather than as a refused connection.
#
# The UI is Grafana's, through the tracesToMetrics link in its datasources, and
# a person's through `make port-forward`.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: jaeger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 4317
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 16686

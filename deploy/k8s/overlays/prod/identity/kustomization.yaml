apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# identity, on the cluster that actually serves.
#
# It differs from staging in one structural way and one only: the images are
# pulled from a registry by digest-stable tag rather than built on the machine
# doing the deploy and imported into its cluster. Everything else staging holds
# holds here, which is the point of having had staging first — base is deployed
# as written, and this file is short enough to read in one sitting.
#
# `make deploy SVC=identity OVERLAY=prod BUILD=0` is how it lands. BUILD=0 is not
# an optimisation: the build path ends in `k3d image import`, which means
# nothing for a cluster that is not on this machine.
namespace: ecommerce

resources:
  - ../../../base/identity
  - sealedsecret.yaml

# The database identity owns, run in-cluster. A managed instance would drop this
# and change IDENTITY_DB_HOST alone.
components:
  - ../../../components/identity-postgres

configMapGenerator:
  - name: identity-config
    behavior: merge
    envs:
      - config.env

generatorOptions:
  disableNameSuffixHash: true

# No secretGenerator, and its absence is most of the difference between this
# overlay and staging's. staging holds its password as a literal because its
# cluster lives for the length of one CI job; this one faces the internet, and a
# password committed to a public repository is not one.
#
# `sealedsecret.yaml` above carries the same values encrypted, written by
# `make seal OVERLAY=prod` and readable only by the controller in the cluster it
# was sealed against. That controller decrypts it into the plain
# `identity-secret` that base mounts with envFrom.
#
# On a first deploy the pod can start before the controller has caught up and
# stop at CreateContainerConfigError. The kubelet retries and it resolves
# itself; a pod still there after a minute means the SealedSecret was sealed
# against a different cluster, which is the one failure that does not heal.

# Published by the `publish` job in CI, which tags every image with the commit
# that produced it. The tag is a SHA rather than a branch name on purpose: it
# names one build forever, so what is running here can be read off this file,
# and a rollback is a change to these four lines rather than a rebuild.
#
# Updating it is `kustomize edit set image` in this directory, or editing the
# tag by hand. Nothing automates it yet — that arrives with the controller that
# watches this directory.
images:
  - name: ecommerce/identity
    newName: ghcr.io/vasapolrittideah/system-design-ecommerce/identity
    newTag: 93f1b260440af66e318ae7569984e10e06033326
  - name: ecommerce/identity-migrate
    newName: ghcr.io/vasapolrittideah/system-design-ecommerce/identity-migrate
    newTag: 93f1b260440af66e318ae7569984e10e06033326

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# bff-web, on the cluster that actually serves.
#
# It is the staging overlay with one value changed — the namespace — and one
# behaviour changed: the tag below moves when a person runs `Deploy prod`,
# rather than on every push to trunk. That is the entire difference, and it is
# meant to be: an environment that stood in front of prod while differing
# structurally from it would be proving something about itself.
#
# The two run on one k3s host, in two namespaces, reconciled by two Argo roots.
#
# `make deploy SVC=bff-web OVERLAY=prod BUILD=0` is the emergency path, for the
# incident where waiting on a commit and a sync is the wrong shape. BUILD=0 is
# not an optimisation: the build path ends in `k3d image import`, which means
# nothing for a cluster that is not on this machine.
namespace: ecommerce

resources:
  - ../../../base/bff-web

# The verification key, as a file rather than a config.env line because a PEM
# does not fit on one. `make keys OVERLAY=prod` writes identity's private half
# beside it and copies the public half here.
configMapGenerator:
  - name: bff-web-config
    behavior: merge
    envs:
      - config.env
    files:
      - BFF_WEB_JWT_PUBLIC_KEY=jwt-public.pem

generatorOptions:
  disableNameSuffixHash: true

# Published by the `publish` job in CI, which tags every image with the commit
# that produced it. The tag is a SHA rather than a branch name on purpose: it
# names one build forever, so what is running here can be read off this file,
# and a rollback is a change to these lines rather than a rebuild.
#
# Moved by the `Deploy prod` workflow, and that commit is the deploy: Argo
# watches this directory on trunk and reconciles the cluster against it.
# Choosing the tag stays a person's job here, which is the difference from
# staging — CI bumps that one on every push, so the tag a person picks here has
# already been running somewhere for a while.
images:
  - name: ecommerce/bff-web
    newName: ghcr.io/vasapolrittideah/system-design-ecommerce/bff-web
    newTag: 13d2328f2615e7593dbfc0d0d6eb1f80940f3e76

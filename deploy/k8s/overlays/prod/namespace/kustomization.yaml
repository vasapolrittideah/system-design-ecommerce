apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace the cluster that serves runs in. staging sits beside it on the
# same host under a name of its own; this one keeps the plain name because it
# is what every other environment's single namespace is also called, and a
# manifest copied between them needs no edit.
namespace: ecommerce

resources:
  - ../../../infra/namespace

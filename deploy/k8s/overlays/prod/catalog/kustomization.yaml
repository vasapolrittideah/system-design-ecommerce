apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# catalog, on the cluster that actually serves.
#
# It is the staging overlay with one value changed — the namespace — and one
# behaviour changed: the tag below moves when a person runs `Deploy prod`,
# rather than on every push to trunk. That is the entire difference, and it is
# meant to be: an environment that stood in front of prod while differing
# structurally from it would be proving something about itself.
#
# The two run on one k3s host, in two namespaces, reconciled by two Argo roots.
#
# `make deploy SVC=catalog OVERLAY=prod BUILD=0` is the emergency path, for the
# incident where waiting on a commit and a sync is the wrong shape. BUILD=0 is
# not an optimisation: the build path ends in `k3d image import`, which means
# nothing for a cluster that is not on this machine.
namespace: ecommerce

resources:
  - ../../../base/catalog
  - sealedsecret.yaml

# The database catalog owns, run in-cluster. A managed instance would drop this
# and change CATALOG_DB_HOST alone.
components:
  - ../../../components/catalog-postgres

configMapGenerator:
  - name: catalog-config
    behavior: merge
    envs:
      - config.env

generatorOptions:
  disableNameSuffixHash: true

# No secretGenerator, and staging has none either — `local` is the one overlay
# that holds its password as a literal, because its cluster is a laptop's and
# has nothing on it worth stealing. Both durable environments face the internet,
# and a password committed to a public repository is not one.
#
# `sealedsecret.yaml` above carries the same values encrypted, written by
# `make seal OVERLAY=prod` and readable only by the controller in the cluster it
# was sealed against. That controller decrypts it into the plain
# `catalog-secret` that base mounts with envFrom.
#
# On a first deploy the pod can start before the controller has caught up and
# stop at CreateContainerConfigError. The kubelet retries and it resolves
# itself; a pod still there after a minute means the SealedSecret was sealed
# against a different cluster, which is the one failure that does not heal.

# Published by the `publish` job in CI, which tags every image with the commit
# that produced it. The tag is a SHA rather than a branch name on purpose: it
# names one build forever, so what is running here can be read off this file,
# and a rollback is a change to these lines rather than a rebuild.
#
# Moved by the `Deploy prod` workflow, and that commit is the deploy: Argo
# watches this directory on trunk and reconciles the cluster against it.
# Choosing the tag stays a person's job here, which is the difference from
# staging — CI bumps that one on every push, so the tag a person picks here has
# already been running somewhere for a while.
images:
  - name: ecommerce/catalog
    newName: ghcr.io/vasapolrittideah/system-design-ecommerce/catalog
    newTag: 13d2328f2615e7593dbfc0d0d6eb1f80940f3e76
  - name: ecommerce/catalog-migrate
    newName: ghcr.io/vasapolrittideah/system-design-ecommerce/catalog-migrate
    newTag: 13d2328f2615e7593dbfc0d0d6eb1f80940f3e76

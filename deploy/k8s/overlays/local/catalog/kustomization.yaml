apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

resources:
  - ../../../base/catalog

# The Postgres instance this service talks to locally, plus the policies that
# keep it reachable by catalog alone. Staging includes the same component; a
# deploy whose database is managed elsewhere would include neither.
components:
  - ../../../components/catalog-postgres

configMapGenerator:
  - name: catalog-config
    behavior: merge
    envs:
      - config.env

# Fixed name, matching the ConfigMap in base and for the same reason: a hashed
# name would leave every superseded copy of the password in the cluster with
# nothing to clean them up.
#
# There is no key file here as there is under identity/. Catalog signs nothing
# and verifies nothing — identity is settled a hop earlier, and the only
# credential this service holds is the one that opens its own database.
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: catalog-secret
    literals:
      # Read from here by both sides: the service connects with it, and
      # postgres.yaml sets POSTGRES_PASSWORD from this same key, so the two
      # cannot drift into a database nobody can log into. Local only — a real
      # deployment takes it from External Secrets.
      #
      # Deliberately not the service name. Tilt redacts every Secret value from
      # its logs, so a password of "catalog" would blank that word out of every
      # line naming the service, its image, or its Deployment.
      - CATALOG_DB_PASSWORD=insecure-local-only

patches:
  - path: patch-hpa.yaml
  - path: patch-deployment.yaml

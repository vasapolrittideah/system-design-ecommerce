apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ecommerce

resources:
  - ../../../base/identity
  - postgres.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: identity-config
    behavior: merge
    envs:
      - config.env

# The private key never enters git. `make keys` writes jwt-private.pem here and
# .gitignore keeps it out; kustomize build fails loudly if it is missing, which
# is the correct outcome — a service that cannot sign has nothing to serve.
#
# Fixed name, matching the ConfigMap in base and for the same reason: a hashed
# name would leave every superseded copy of the signing key in the cluster with
# nothing to clean them up. Rotating the key updates this one object, and the
# Reloader annotation on the Deployment is what restarts the pods holding the
# old one.
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: identity-secret
    literals:
      # Read from here by both sides: the service connects with it, and
      # postgres.yaml sets POSTGRES_PASSWORD from this same key, so the two
      # cannot drift into a database nobody can log into. Local only — a real
      # deployment takes it from External Secrets.
      #
      # Deliberately not the service name. Tilt redacts every Secret value from
      # its logs, so a password of "identity" would blank that word out of
      # every line naming the service, its image, or its Deployment.
      - IDENTITY_DB_PASSWORD=insecure-local-only
    files:
      - IDENTITY_JWT_PRIVATE_KEY=jwt-private.pem

patches:
  - path: patch-hpa.yaml
  - path: patch-deployment.yaml

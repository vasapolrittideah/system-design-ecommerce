apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace the laptop stack runs in. It is the same name prod uses, and
# that costs nothing: this cluster holds one environment. staging is the only
# overlay that needs a name of its own, because it shares a cluster with prod.
namespace: ecommerce

resources:
  - ../../../infra/namespace

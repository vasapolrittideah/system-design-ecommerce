apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# identity, on the environment that stands in front of prod.
#
# Every mechanism prod's deploy depends on is exercised here first, on the same
# host, against the same registry, through the same controller: images pulled
# by immutable tag, credentials that arrive sealed, and a reconcile driven by a
# commit rather than by where somebody's kubectl points. What separates the two
# is the namespace at the top of this file and nothing structural — which is
# what makes a green staging a statement about prod instead of about staging.
#
# It moves on its own. CI bumps the tags below to every commit that lands on
# trunk, so this environment is trunk's tip and prod is a deliberate promotion
# away from it. That asymmetry is the reason to have it.
namespace: ecommerce-staging

resources:
  - ../../../base/identity
  - sealedsecret.yaml

# The database identity owns, run in-cluster — the same component prod includes,
# so the instance staging exercises is the instance prod runs. It lands in this
# namespace and its NetworkPolicy admits pods labelled identity in this namespace,
# so prod's identity cannot reach it and it cannot reach prod's.
components:
  - ../../../components/identity-postgres

configMapGenerator:
  - name: identity-config
    behavior: merge
    envs:
      - config.env

generatorOptions:
  disableNameSuffixHash: true

# No secretGenerator. This cluster is on the internet and its repository is
# public, so the same rule prod follows applies unchanged: `make seal
# OVERLAY=staging` encrypts the material into sealedsecret.yaml above, and the
# controller in kube-system decrypts it into the plain `identity-secret` that
# base mounts with envFrom.
#
# Sealing is scoped to namespace and name together, so a SealedSecret written
# for ecommerce cannot be copied here by editing its namespace field — staging's
# have to be sealed as staging's. That is a feature: it is also why a credential
# cannot be shared between the two environments by accident.

# Bumped by the `promote-staging` job in CI on every push to trunk, which is
# what makes this environment trunk's tip without anyone deploying it. The tag
# is still a SHA and never a branch: an image reference has to name one build
# forever, or a rollback is a rebuild and a controller cannot see it change.
images:
  - name: ecommerce/identity
    newName: ghcr.io/vasapolrittideah/system-design-ecommerce/identity
    newTag: 3afe2ef321288cf22184bde2a95d3cd384a0468c
  - name: ecommerce/identity-migrate
    newName: ghcr.io/vasapolrittideah/system-design-ecommerce/identity-migrate
    newTag: 3afe2ef321288cf22184bde2a95d3cd384a0468c

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# bff-web, on the environment that stands in front of prod.
#
# Every mechanism prod's deploy depends on is exercised here first, on the same
# host, against the same registry, through the same controller. What separates
# the two is the namespace at the top of this file and nothing structural.
#
# It moves on its own: CI bumps the tags below to every commit that lands on
# trunk, so this environment is trunk's tip and prod is a deliberate promotion
# away from it.
namespace: ecommerce-staging

resources:
  - ../../../base/bff-web

# The verification key, as a file rather than a config.env line because a PEM
# does not fit on one. `make keys OVERLAY=staging` writes identity's private
# half beside it and copies the public half here.
#
# It is committed, and it has to be: Argo renders this directory from a clean
# checkout on the cluster, where a file that exists only on an operator's laptop
# does not exist. Committing costs nothing — this half verifies a signature and
# can never make one — and .gitignore names it explicitly for that reason.
configMapGenerator:
  - name: bff-web-config
    behavior: merge
    envs:
      - config.env
    files:
      - BFF_WEB_JWT_PUBLIC_KEY=jwt-public.pem

generatorOptions:
  disableNameSuffixHash: true

# This service holds no Secret: a public verification key is all the credential
# it has, so there is no sealedsecret.yaml here the way there is beside every
# service that owns a database.

# Bumped by the `promote-staging` job in CI on every push to trunk.
images:
  - name: ecommerce/bff-web
    newName: ghcr.io/vasapolrittideah/system-design-ecommerce/bff-web
    newTag: 8153241f39a4d8506f90e50e00ffb56a57f1c40d

# The boundary every Application below is allowed to act inside.
#
# Argo ships a `default` project that permits any repository, any cluster, any
# namespace, and any kind — which makes an Application a thing that can do
# anything the controller can. This one says what these five actually need, and
# it is the same instinct as the NetworkPolicies beside the workloads: the rule
# is written next to the thing it constrains, and a change that steps outside it
# fails rather than working.
#
# It also names one namespace, which is what keeps prod and staging apart now
# that they share a cluster: an Application here that a bad merge pointed at a
# staging overlay is refused rather than applied.
#
# The cluster-scoped allow-list is empty, and that is a statement rather than an
# omission. It once held two kinds for Reloader's ClusterRole and
# ClusterRoleBinding; those moved to kube-system, installed by `make up` as a
# cluster singleton, precisely because two environments cannot own one
# cluster-scoped object between them. Prometheus and Alloy need nothing here —
# their discovery is namespace-scoped and so is their RBAC. So a Namespace, a
# CRD, a webhook, or a PersistentVolume appearing in a render is refused.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ecommerce
  namespace: argocd
  annotations:
    # Before the Applications that name it. Argo has no dependency graph; a
    # wave is how one resource is made to land first.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: The e-commerce stack, reconciled from trunk into ecommerce

  sourceRepos:
    - https://github.com/vasapolrittideah/system-design-ecommerce.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: ecommerce

  clusterResourceWhitelist: []

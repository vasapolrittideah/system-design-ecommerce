apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No namespace here on purpose: base describes the service, an overlay decides
# where it lands. Same for the image tag — kustomize rewrites it per overlay.

resources:
  - deployment.yaml
  - service.yaml
  - migration-job.yaml
  - hpa.yaml

# includeSelectors stays off: every selector in this directory is written by
# hand, and a transformer that edits a Job's auto-generated selector produces
# an immutable-field error on the second apply.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: identity
      app.kubernetes.io/part-of: ecommerce

# A generator rather than a plain ConfigMap: kustomize appends a content hash
# to the name, so changing a value rolls the Deployment. A plain ConfigMap
# would update in place and leave every running pod on the old values with
# nothing to indicate it.
configMapGenerator:
  - name: identity-config
    envs:
      - config.env

images:
  - name: ecommerce/identity
    newTag: dev
  - name: ecommerce/identity-migrate
    newTag: dev

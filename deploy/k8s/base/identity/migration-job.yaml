# Migrations run here, never on application startup. A process that migrates
# as it boots runs the migration once per replica, races itself during a
# rollout, and makes a schema change a restart away from any pod that happens
# to come up first.
#
# The Job is immutable once created, so a redeploy has to delete it before
# applying — `make deploy` does that, and it is also what orders the migration
# ahead of the rollout, since kustomize has no notion of hooks.
apiVersion: batch/v1
kind: Job
metadata:
  name: identity-migrate
spec:
  # goose runs each migration in a transaction and records nothing when it
  # rolls back, so a lock timeout or a dropped connection clears itself on the
  # next attempt rather than leaving a version to be forced by hand.
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: goose
          image: ecommerce/identity-migrate
          imagePullPolicy: IfNotPresent
          # The DSN is assembled here rather than stored in the Secret, so the
          # host, user, and database name have exactly one definition and the
          # Secret holds only the part that is actually secret.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              exec goose -dir /migrations postgres \
                "postgres://${IDENTITY_DB_USER}:${IDENTITY_DB_PASSWORD}@${IDENTITY_DB_HOST}:${IDENTITY_DB_PORT}/${IDENTITY_DB_DATABASE}?sslmode=${IDENTITY_DB_SSLMODE}" \
                up
          envFrom:
            - configMapRef:
                name: identity-config
            - secretRef:
                name: identity-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

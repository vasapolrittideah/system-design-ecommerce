# Headless, for the same reason identity's Service is, arrived at from the other
# direction.
#
# There the caller is gRPC, holding one long-lived HTTP/2 connection. Here it is
# Kong, holding a pool of keep-alive HTTP/1.1 connections — and a pool pinned to
# one address is pinned just as firmly. With no cluster IP the record answers
# with the pod IPs, which is what Kong's upstream ring balancer needs in order
# to have anything to balance across, and what makes a replica the HPA just
# added receive requests instead of waiting for something to reconnect.
apiVersion: v1
kind: Service
metadata:
  name: bff-web
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: bff-web
  ports:
    - name: http
      port: 8080
      targetPort: http
    # Scraping and probing go here, on a port that is never routed to from
    # outside the cluster.
    - name: admin
      port: 9090
      targetPort: admin

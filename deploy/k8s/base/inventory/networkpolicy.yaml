# Who may reach inventory, and what inventory may reach.
#
# Ports are numeric rather than the names the Services and the scrape config use.
# A NetworkPolicy may name a port, but the resolution is the CNI's to implement
# and a rule the CNI silently ignores is a rule that is not there — the one
# failure mode this whole file exists to remove.
#
# The selector is the name label alone, so it covers all three workloads that
# wear it: the server, the reaper, and the migration Job. That is deliberate —
# they share a database and a set of dependencies — and it is why the Job needs
# no policy of its own. The egress rule they all depend on, the one reaching
# Postgres, is in the local overlay beside the database it reaches.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventory
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: inventory
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # bff-web reads stock counts for a product page. It is the only caller so
    # far; the order service is what will reserve, commit, and release, and its
    # rule arrives with it —
    #
    #     - from:
    #         - podSelector:
    #             matchLabels:
    #               app.kubernetes.io/name: order
    #       ports:
    #         - protocol: TCP
    #           port: 50051
    #
    # Kong is deliberately absent and will stay so: north-south traffic
    # terminates at a BFF, and a gateway that could reach a service directly is
    # the shape this rule exists to prevent. The gRPC port stays reachable from
    # the node as well — probes and `kubectl port-forward` are not filtered,
    # which is how grpcurl reaches it locally.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff-web
      ports:
        - protocol: TCP
          port: 50051
    # The admin port carries /metrics, /healthz, and /readyz. Only the scraper
    # has a reason to reach it from another pod.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # DNS, selected by the label the API server puts on every namespace rather
    # than by kube-dns's ClusterIP, which differs per cluster. Forgetting this
    # rule breaks name resolution rather than one dependency, so it reads as
    # every dependency being down at once.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Spans, over OTLP/gRPC. The reaper needs this as much as the server does:
    # its sweeps are the root of their own traces, since nothing calls them.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - protocol: TCP
          port: 4317

# Headless: clusterIP None makes DNS return one A record per ready pod instead
# of a single virtual IP. gRPC holds one long-lived HTTP/2 connection, so a
# normal ClusterIP would pin every caller to whichever replica it happened to
# land on and the other replicas would sit idle. Callers dial
# dns:///order.<namespace>.svc.cluster.local:50051 and balance round-robin
# across what they resolve.
apiVersion: v1
kind: Service
metadata:
  name: order
spec:
  clusterIP: None
  # Left at the default false: a pod that is not ready must not be in the list
  # a caller resolves.
  publishNotReadyAddresses: false
  # Three workloads wear app.kubernetes.io/name: order — the server, the
  # outbox relay, and the migration Job — because that is what the
  # NetworkPolicies and the database's ingress rule are written against. A
  # selector naming only that would put the relay's pods and a running
  # migration into this Service's endpoint list, where a gRPC caller would
  # resolve them and dial a port nothing is listening on. Neither pod would
  # report anything wrong.
  selector:
    app.kubernetes.io/name: order
    app.kubernetes.io/component: server
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: grpc
    # Scraping and probing go here, on a port that is never routed to from
    # outside the cluster.
    - name: admin
      port: 9090
      targetPort: admin

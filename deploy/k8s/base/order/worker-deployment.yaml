# The worker that runs both of this service's subscriptions.
#
# One reads the payment service's events and moves the order's own state
# machine; the other reads this service's own events and makes the one call to
# inventory that an order's outcome triggers — turning a reservation into a
# sale once the money is in, and giving it back once the order is cancelled.
#
# Two consumers in one process rather than a Deployment each, because they are
# two halves of one saga driving one use case. The reason a background loop
# gets a workload of its own is that a goroutine per replica multiplies the
# work it does; a consumer group does not, since Kafka assigns each partition
# to exactly one member.
#
# Its own workload rather than a goroutine inside the server, for the same
# reason the outbox relay has one — and unlike the relay, running more than one
# replica here is safe by design rather than merely tolerated during a
# rollout: Kafka assigns each partition to exactly one member of a consumer
# group at a time, so two pods in KAFKA_CONSUMER_GROUP_ID never handle the
# same message twice for a reason ordering would need to prevent. One replica
# today because nothing yet needs the other five partitions' worth of
# parallelism.
#
# The same image as the server, picking a different binary. One image holds
# all of cmd/, so there is no second build to keep in step.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-worker
  annotations:
    reloader.stakater.com/auto: "true"
    # After the migration in wave 1, so the worker never starts against a
    # schema the release has not applied yet. Inert where Argo is not
    # watching.
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: order
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order
        app.kubernetes.io/component: worker
        app.kubernetes.io/version: dev
    spec:
      # No preStop sleep: nothing routes to this pod, so there is no endpoint
      # list to drain out of. What the grace period covers is the message in
      # flight — kafkax.Consumer leaves its offset uncommitted on SIGTERM, and
      # the next process to own the partition redelivers it.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: ecommerce/order
          imagePullPolicy: IfNotPresent
          # The one line that makes this a different workload from the server.
          command: ["/app/worker"]
          ports:
            # No gRPC port: this process serves nothing. The admin port is
            # here because Prometheus discovers targets by a port being called
            # `admin`, and the DLQ counter it scrapes is the only thing that
            # shows this consumer is giving up on messages.
            - name: admin
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-secret
          env:
            - name: OBS_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: LOG_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
          startupProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 10
            failureThreshold: 3
          # Readiness is here even though no Service selects this pod, because
          # it is what `kubectl rollout status` waits on — without it a deploy
          # reports success against a process that has not reached its
          # database. It covers the database and deliberately not the broker
          # or inventory: a consumer that cannot reach either should keep
          # retrying, not be restarted.
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

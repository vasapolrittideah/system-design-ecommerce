# Who may reach order, and what order may reach.
#
# Ports are numeric rather than the names the Service and the scrape config use.
# A NetworkPolicy may name a port, but the resolution is the CNI's to implement
# and a rule the CNI silently ignores is a rule that is not there — the one
# failure mode this whole file exists to remove.
#
# The migration Job's pods carry app.kubernetes.io/name: order too, so they
# are selected by everything here. That is why the Job needs no policy of its
# own, and why the egress rule it depends on — the one reaching Postgres — is
# in the local overlay beside the database it reaches.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # gRPC, from the BFF and from payment. Kong is deliberately absent:
    # north-south traffic terminates at bff-web, and a gateway that could reach
    # a service directly is the shape this rule exists to prevent.
    #
    # payment reads an order before it asks anybody for money, to learn what it
    # costs and whether it may still be paid for. Its own egress list names
    # this service; both halves have to exist or the call is refused by the
    # side that did not get written — which arrives as `connection refused` and
    # reads as order being down.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff-web
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payment
      ports:
        - protocol: TCP
          port: 50051
    # The admin port carries /metrics, /healthz, and /readyz. Only the scraper
    # has a reason to reach it from another pod; the kubelet's probes come from
    # the node, which is not a pod and not subject to this.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
  egress:
    # DNS, selected by the label the API server puts on every namespace rather
    # than by kube-dns's ClusterIP, which differs per cluster. Forgetting this
    # rule breaks name resolution rather than one dependency, so it reads as
    # every dependency being down at once.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Spans, over OTLP/gRPC.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - protocol: TCP
          port: 4317
    # The two services this service calls: catalog and inventory, reached both
    # by the server's Checkout and by the worker's own commit or release of a
    # reservation once the order's outcome comes back to it. This is the whole
    # of east-west
    # traffic for this service, and Kong is deliberately absent from it: a
    # gateway that could be reached from here would be a way to leave the
    # cluster and come back in past everything it does.
    #
    # The name alone, without a component. Which of a service's workloads
    # answers on 50051 is that service's business — inventory happens to label
    # its server pods because it runs a reaper beside them and catalog does not
    # label anything — and an egress rule that named the component would be a
    # rule that breaks when the callee grows a second deployment. The pods it
    # additionally admits listen on nothing.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: inventory
      ports:
        - protocol: TCP
          port: 50051
    # The broker, for the outbox relay's publishes and the worker's own reads
    # and DLQ writes. It wears app.kubernetes.io/name: order like every other
    # workload this service ships, so this rule reaches it without a policy of
    # its own — and the server, which touches Kafka not at all, gains a route
    # it never dials.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka
              app.kubernetes.io/component: broker
      ports:
        - protocol: TCP
          port: 9092

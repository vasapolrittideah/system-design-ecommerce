rules:
  - name: no-delete-without-where
    message: a DELETE without WHERE empties the table
    rule: query.sql.startsWith("DELETE") && !query.sql.contains("WHERE")
  - name: no-update-without-where
    message: an UPDATE without WHERE rewrites every row
    rule: query.sql.startsWith("UPDATE") && !query.sql.contains("WHERE")

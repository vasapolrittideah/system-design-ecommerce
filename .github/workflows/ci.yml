name: CI

# A merge into trunk is a push to trunk, so the push trigger is the one that was
# asked for. The pull_request trigger is what turns this from a report into a
# gate: by the time a push to trunk fails, the broken commit is already the
# branch everyone else builds on. Point branch protection at the `ci` job below.
on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull request run tells nobody anything. A superseded trunk run is
# the only record that a particular commit was green, so those are left alone.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Tool versions are read out of the Makefile rather than repeated here, so
      # a bump there moves CI with it instead of leaving two pins to notice.
      - name: Read pinned tool versions
        id: tools
        run: echo "golangci-lint=$(make print-GOLANGCI_LINT_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ steps.tools.outputs.golangci-lint }}

      # always(): unformatted code and a lint failure are separate answers, and
      # fixing one blind to the other costs a second round trip.
      - name: Formatting
        if: always()
        run: make fmt-check

  proto:
    name: Proto contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # buf breaking compares against a ref that has to exist locally.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Read pinned tool versions
        id: tools
        run: echo "buf=$(make print-BUF_VERSION)" >> "$GITHUB_OUTPUT"

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: ${{ steps.tools.outputs.buf }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - run: make proto-lint

      # On a pull request the baseline is trunk. On a push to trunk the baseline
      # cannot be trunk — that is the commit under test — so it is the state
      # trunk was in before this push, which for a merge commit is its first
      # parent. The very first commit has neither and is skipped.
      - name: Choose the breaking-change baseline
        id: baseline
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "against=.git#branch=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          elif git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            echo "against=.git#ref=HEAD~1" >> "$GITHUB_OUTPUT"
          else
            echo "against=" >> "$GITHUB_OUTPUT"
          fi

      - name: Breaking changes
        if: steps.baseline.outputs.against != ''
        run: make proto-breaking BREAKING_AGAINST='${{ steps.baseline.outputs.against }}'

      - name: gen/ is in step with proto/
        run: make proto-check

  generated:
    name: Generated code and modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Read pinned tool versions
        id: tools
        run: |
          {
            echo "sqlc=$(make print-SQLC_VERSION)"
            echo "mockery=$(make print-MOCKERY_VERSION)"
          } >> "$GITHUB_OUTPUT"

      # Installed straight rather than through `make tools`, which would also
      # build buf and golangci-lint that this job never runs.
      - name: Install generators
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@${{ steps.tools.outputs.sqlc }}
          go install github.com/vektra/mockery/v3@${{ steps.tools.outputs.mockery }}

      - run: make sqlc-vet

      - name: sqlc output is in step with db/
        run: make sqlc-check

      - name: Mocks are in step with port/
        run: make mock-check

      - name: go.mod and go.sum are tidy
        run: make tidy-check

  test:
    name: Tests
    runs-on: ubuntu-latest
    # The adapter and outbox tests start real PostgreSQL containers through
    # testcontainers, using the Docker daemon the runner already provides. The
    # whole suite is about two minutes; the ceiling is for a hung container.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: make cover

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          retention-days: 14
          if-no-files-found: ignore

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Unpinned on purpose: a scanner's job is to know about advisories that
      # did not exist when a version would have been pinned. It reports only
      # vulnerabilities reachable from this code, so it is quiet enough to block.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - run: govulncheck ./...

  # The image list is discovered rather than written down, so a new service is
  # built for having a Dockerfile. A hardcoded matrix would leave the third
  # service unbuilt with nothing saying so.
  discover:
    name: Discover services
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@v5

      - id: list
        run: |
          services=$(find services -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' \
            | xargs -n1 basename | sort | jq -R . | jq -sc .)
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "$services"

  images:
    name: Image (${{ matrix.service }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Read pinned tool versions
        id: tools
        run: echo "goose=$(make print-GOOSE_VERSION)" >> "$GITHUB_OUTPUT"

      # Built and thrown away: this proves the Dockerfile still builds, which no
      # Go test covers. Publishing happens in `publish`, on trunk only.
      #
      # Both architectures, because `publish` ships both and a pull request is
      # where a break in either has to surface. They are not free but they are
      # close to it: the build stage cross-compiles on the runner's own
      # architecture, and only the migrate stage's apk runs emulated.
      - uses: docker/build-push-action@v6
        with:
          # The build context is the repository root — one go.mod covers every
          # service, so a context scoped to the service cannot see its module.
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          build-args: GOOSE_VERSION=${{ steps.tools.outputs.goose }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # The manifests, applied to a cluster that did not exist a minute ago.
  #
  # Everything else in this workflow tests the Go code. This tests the half that
  # has no Go test and that `make deploy` on a laptop cannot: an apply against an
  # empty cluster rather than over yesterday's objects, so a resource nobody
  # creates any more, a policy that only works because an old one is still there,
  # and an ordering that only holds when the database is already running all
  # surface here.
  #
  # It applies overlays/local, and deliberately not overlays/staging: that one
  # pulls published images by SHA — which do not exist for an unmerged commit —
  # and reads credentials sealed against the k3s host, which a cluster created a
  # minute ago holds no key for.
  #
  # What that costs, stated plainly: base's own values are not what CI deploys.
  # The local overlay patches the CPU requests and the HPA bounds, and its
  # config.env carries console logs, gRPC reflection, a sample ratio of 1.0 and a
  # two-minute reservation TTL. A bad default in base/*/config.env therefore
  # passes here and is caught on trunk instead, minutes later, when staging syncs
  # and its smoke test runs. That is the trade for having three overlays named
  # after the three places this actually runs, rather than a fourth that exists
  # only to be applied here.
  #
  # It builds its own images rather than depending on the `images` job above.
  # That job's artifacts are thrown away, and its build cache cannot be reached
  # from a plain `run:` step — the GitHub cache backend needs runtime credentials
  # that only the docker build action is handed. Sharing it would mean adding a
  # third-party action to export them, which is a larger decision than the few
  # minutes it saves; running the two in parallel gets the green build in sooner
  # anyway.
  stack:
    name: Stack on k3d
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Read pinned tool versions
        id: tools
        run: echo "k3d=$(make print-K3D_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Install k3d
        run: |
          curl -sfL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | TAG=${{ steps.tools.outputs.k3d }} bash
          k3d version

      # One agent rather than the two a laptop gets, so the cluster is two nodes.
      # The second node is what makes a cross-node NetworkPolicy real; a third
      # k3s container on a runner already hosting the whole stack buys nothing
      # the second did not.
      - name: Create the cluster
        run: make cluster-create AGENTS=1

      # The same command a developer runs, writing into the staging overlay
      # instead. Both halves of the pair land in one step, which is the failure
      # this cannot have: a private key and a public key from different runs
      # leave every pod Ready and every login answering 401.
      - name: Generate the signing key pair
        run: make keys OVERLAY=local

      # The local overlay of the infra, for the same reason the services below
      # are deployed from theirs: base holds no value that names a cluster, so
      # something has to supply the gateway's origin list.
      - name: Shared infrastructure
        run: make up OVERLAY=local

      # Serial, and the first service pays for all four: they share a go.mod, so
      # the module-download layer is built once and reused by the rest.
      - name: Build and import images
        run: |
          for svc in $(make print-SERVICES); do
            echo "::group::$svc"
            make image SVC="$svc"
            echo "::endgroup::"
          done

      # Deploys every service, runs each migration Job, waits for every rollout,
      # and finishes on scripts/smoke.sh through Kong — which is the assertion
      # that matters here, since a pod reporting Ready is a claim it makes about
      # itself and says nothing about whether the system serves.
      - name: Deploy and smoke
        run: make stack OVERLAY=local

      # A cluster that failed with no output is a job nobody can act on, and the
      # cluster is gone by the time anyone looks.
      - name: Diagnostics
        if: failure()
        run: |
          set +e
          echo "::group::pods"
          kubectl -n ecommerce get pods -o wide
          echo "::endgroup::"
          echo "::group::jobs and endpoints"
          kubectl -n ecommerce get jobs,endpoints
          echo "::endgroup::"
          echo "::group::events"
          kubectl -n ecommerce get events --sort-by=.lastTimestamp | tail -60
          echo "::endgroup::"
          echo "::group::not running"
          kubectl -n ecommerce get pods \
            --field-selector=status.phase!=Running -o yaml
          echo "::endgroup::"
          for svc in $(make print-SERVICES); do
            echo "::group::logs $svc"
            kubectl -n ecommerce logs -l "app.kubernetes.io/name=$svc" \
              --all-containers --prefix --tail=100
            echo "::endgroup::"
          done

  # Immutable images, one set per commit that lands on trunk.
  #
  # It runs after `ci`, so nothing is published from a commit whose tests or
  # manifests failed. A pull request never reaches it: GITHUB_TOKEN has no
  # packages:write on a fork, and an image built from an unmerged branch has
  # nothing that should be deploying it.
  #
  # The tag is the commit SHA and there is deliberately no moving tag beside it.
  # A tag that follows trunk is one somebody deploys by accident, and it is also
  # the tag a GitOps controller cannot see change — the whole reason for
  # publishing this way is that the reference names one build forever.
  publish:
    name: Publish (${{ matrix.service }})
    needs: [discover, ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Only this job writes packages. The workflow-level grant stays read-only.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      # The server stage cross-compiles and needs no emulation, but the migrate
      # stage installs ca-certificates with apk, and that RUN executes as the
      # target architecture.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read pinned tool versions
        id: tools
        run: echo "goose=$(make print-GOOSE_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        env:
          SERVICE: ${{ matrix.service }}
          SHA: ${{ github.sha }}
          GOOSE_VERSION: ${{ steps.tools.outputs.goose }}
        run: |
          # ghcr rejects an upper-case path, and github.repository preserves
          # whatever case the owner registered.
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')

          build() {
            local target="$1" image="$2"
            echo "::group::$image"
            # Both architectures, because the host this is eventually deployed
            # to is not chosen yet — Ampere instances are ARM and most rented
            # servers are not. --provenance=false keeps the index to exactly
            # the two platform manifests the check below counts; nothing here
            # consumes an attestation yet.
            docker buildx build --push --provenance=false \
              --platform linux/amd64,linux/arm64 \
              -f "services/${SERVICE}/Dockerfile" --target "$target" \
              --build-arg "GOOSE_VERSION=${GOOSE_VERSION}" \
              -t "$image" .
            echo "::endgroup::"
          }

          server="ghcr.io/${repo}/${SERVICE}:${SHA}"
          build server "$server"
          echo "server=$server" >> "$GITHUB_OUTPUT"

          # A migrate image exists only for a service that owns a database, and
          # the migrations directory is what says so.
          if [ -d "services/${SERVICE}/db/migrations" ]; then
            migrate="ghcr.io/${repo}/${SERVICE}-migrate:${SHA}"
            build migrate "$migrate"
            echo "migrate=$migrate" >> "$GITHUB_OUTPUT"
          fi

      # A push that reported success and left one architecture behind is the
      # failure this catches, and it would otherwise surface as an ImagePullBackOff
      # on whichever host happens not to be amd64.
      - name: Both architectures are present
        env:
          SERVER: ${{ steps.push.outputs.server }}
          MIGRATE: ${{ steps.push.outputs.migrate }}
        run: |
          for image in $SERVER $MIGRATE; do
            echo "::group::$image"
            manifest=$(docker buildx imagetools inspect "$image")
            echo "$manifest"
            echo "::endgroup::"
            for platform in linux/amd64 linux/arm64; do
              grep -q "$platform" <<<"$manifest" \
                || { echo "$image is missing $platform"; exit 1; }
            done
            echo "  ok   $image"
          done

      - name: Summary
        if: always() && steps.push.outputs.server != ''
        env:
          SERVER: ${{ steps.push.outputs.server }}
          MIGRATE: ${{ steps.push.outputs.migrate }}
        run: |
          {
            for image in $SERVER $MIGRATE; do echo "- \`$image\`"; done
          } >> "$GITHUB_STEP_SUMMARY"

  # staging follows trunk, and this is what makes that true.
  #
  # prod's image tags are bumped by a person running `Deploy prod`, because
  # choosing which build serves customers is a decision worth keeping a person
  # in. staging's are bumped here, on every commit that lands, because an
  # environment somebody has to remember to deploy is one that silently falls
  # months behind and then proves nothing about the release standing behind it.
  #
  # It runs after `publish`, so the images it points at exist by the time Argo
  # looks for them. The commit it pushes carries [skip ci] and therefore does
  # not re-enter this workflow.
  promote-staging:
    name: Point staging at ${{ github.sha }}
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Pushing the bump commit to trunk.
      contents: write
      # Reading image manifests back off ghcr.
      packages: read
    # Two of these racing would both rebase onto trunk and both push; the second
    # would win with the older SHA. One at a time, and a superseded run has
    # nothing to say.
    concurrency:
      group: promote-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: trunk
          fetch-depth: 0

      # staging is optional infrastructure: the overlay is in the repository
      # from the day it was written, but nothing can deploy it until an operator
      # has sealed its credentials against the k3s host. Until then this job has
      # nothing to point at, and going red on trunk over an environment that
      # does not exist yet would be noise nobody could act on.
      - name: Is staging provisioned
        id: provisioned
        run: |
          if [ -f deploy/k8s/overlays/staging/identity/sealedsecret.yaml ]; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
          else
            echo "yes=false" >> "$GITHUB_OUTPUT"
            {
              echo "### staging is not provisioned yet"
              echo
              echo "No \`deploy/k8s/overlays/staging/identity/sealedsecret.yaml\`."
              echo "Run \`make seal OVERLAY=staging\` against the k3s host and commit the result."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rewrite the tags
        if: steps.provisioned.outputs.yes == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          find deploy/k8s/overlays/staging -name kustomization.yaml \
            -exec sed -i -E "s|^([[:space:]]*newTag:[[:space:]]*).*|\1${SHA}|" {} +
          git --no-pager diff --stat

      # The list of images to check comes from rendering the overlays rather
      # than from reconstructing the naming rule a second time — the same thing
      # deploy-prod.yml does, for the same reason: whatever the cluster would
      # pull is exactly what is verified, so a service whose overlay missed a
      # bump is caught by the step that catches a tag that was never published.
      - name: Render and collect what staging would pull
        id: render
        if: steps.provisioned.outputs.yes == 'true'
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          prefix="ghcr.io/${repo}/"

          : > images.txt
          for dir in deploy/k8s/overlays/staging/*/; do
            # namespace/ renders a Namespace and a NetworkPolicy and pulls
            # nothing; it is in this directory because it is per-environment,
            # not because it is a workload.
            [ "$(basename "$dir")" = "namespace" ] && continue
            echo "::group::$(basename "$dir")"
            kubectl kustomize "$dir" > rendered.yaml || exit 1
            grep -oE "image: ${prefix}[^[:space:]]+" rendered.yaml \
              | awk '{print $2}' | sort -u | tee -a images.txt
            echo "::endgroup::"
          done
          sort -u -o images.txt images.txt

          [ -s images.txt ] || { echo "::error::no ${prefix} image in the render"; exit 1; }

          if grep -v ":${{ github.sha }}$" images.txt; then
            echo "::error::the images above did not take the new tag"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.provisioned.outputs.yes == 'true'

      - uses: docker/login-action@v3
        if: steps.provisioned.outputs.yes == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Every image exists, on both architectures
        if: steps.provisioned.outputs.yes == 'true'
        run: |
          while read -r image; do
            manifest=$(docker buildx imagetools inspect "$image" 2>&1) || {
              echo "$manifest"
              echo "::error::$image is not on ghcr — did publish succeed for this commit?"
              exit 1
            }
            for platform in linux/amd64 linux/arm64; do
              grep -q "$platform" <<<"$manifest" \
                || { echo "::error::$image is missing $platform"; exit 1; }
            done
            echo "  ok   $image"
          done < images.txt

      # --rebase before pushing, because release-please and Deploy prod push to
      # this branch too and trunk may have moved while the images were being
      # built. The rebase is safe: this commit touches only newTag lines that
      # nothing else in the repository writes.
      - name: Commit the bump
        id: push
        if: steps.provisioned.outputs.yes == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add deploy/k8s/overlays/staging
          if git diff --cached --quiet; then
            echo "staging is already on ${SHA} — nothing to push"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          short=$(git rev-parse --short "$SHA")
          {
            printf '%s\n\n' "chore(deploy): point staging images at ${short}"
            printf '%s\n' "staging follows trunk, so this is automatic and needs no review."
            printf '%s\n\n' "Argo reconciles it within a few minutes; prod is unaffected."
            printf '%s\n' "[skip ci]"
          } > "${RUNNER_TEMP}/commit-msg"
          git commit -F "${RUNNER_TEMP}/commit-msg"

          for attempt in 1 2 3; do
            git pull --rebase --autostash origin trunk || exit 1
            if git push origin HEAD:trunk; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected, trunk moved — retrying ($attempt)"
            sleep 5
          done
          echo "::error::could not push the staging bump after three attempts"
          exit 1

      - name: Summary
        if: always() && steps.push.outputs.changed == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          {
            echo "### staging now points at \`$(git rev-parse --short "$SHA")\`"
            echo
            echo "Argo syncs within a few minutes; each migration Job runs first."
            echo "Promote it to prod with the **Deploy prod** workflow once it looks right."
          } >> "$GITHUB_STEP_SUMMARY"

  # One status check to require in branch protection. Without it, protection has
  # to name every job above, and a job added here would not be required until
  # someone remembered to add it there too.
  ci:
    name: CI
    if: always()
    needs: [lint, proto, generated, test, vulnerabilities, images, stack]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          [[ "$results" != *failure* && "$results" != *cancelled* ]] || exit 1

openapi: 3.1.0

info:
  title: bff-web
  version: 1.0.0
  summary: The storefront's HTTP API.
  description: |
    One endpoint per screen, not per entity: `GET /api/v1/products` answers the
    listing grid, and a field no card renders is left behind rather than
    forwarded because a service happened to return it. A shape here is a screen's
    shape, and it changes when the screen does.

    This document is hand-written and checked against the running router by a
    contract test, so an endpoint or a field that appears in one and not the
    other fails the build rather than drifting quietly.

    ## Reading a failure

    Every failure this API decides on is one shape — see `ErrorResponse` — and
    every field is camelCase.

    Branch on `error.code`, never on the HTTP status. A 409 alone cannot say
    whether an email was taken or an order was already paid, and the codes are
    machine-stable: renaming one is a breaking change.

    Three answers come from the gateway instead and cannot carry that shape,
    because it short-circuits them before this service is reached. They are JSON,
    but they carry `message` and no `error.code`:

    | Status | When |
    | --- | --- |
    | 429 | rate limited at the edge |
    | 413 | body past the gateway's hard cap, 8× the one this service enforces |
    | 502, 503, 504 | this service is unreachable or too slow to answer |

    So a client needs one rule for the remainder: **no `error.code` means derive
    it from the status** — 429 is `RATE_LIMITED`, 5xx is `UPSTREAM_UNAVAILABLE`.
    It needs that rule regardless, since a CDN or load balancer above the gateway
    answers in its own shape too.

    Note that 503 and 504 appear on both sides of that line: an unreachable
    service *behind* this one is answered here, in this shape.

    ## Correlation

    Read the correlation ID from the `X-Correlation-ID` response header, not from
    `error.correlationId`. The gateway echoes the header on every answer
    including its own; the body field exists only when this service wrote the
    body. One source works for both.

    Send `X-Correlation-ID` yourself to tie a client-side operation to
    everything it caused; one is minted when you do not.

    ## Language

    Responses are localised from `Accept-Language`, defaulting to `en`, with the
    negotiated language echoed as `Content-Language`. Only
    `error.fields[].message` is translated. `error.message` is a developer aid
    and a last-resort string — never render it to a user.

servers:
  - url: http://localhost:8000
    description: The gateway on the local k3d load balancer.

tags:
  - name: auth
    description: Opening, renewing, and ending a session.
  - name: account
    description: The signed-in person's own account.
  - name: storefront
    description: What is on sale, shaped for the screen that shows it.
  - name: orders
    description: Buying, and the record of what was bought.
  - name: payments
    description: |
      Paying for an order, and what the provider says about it afterwards.

paths:
  /api/v1/auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create an account
      description: |
        Returns the person and no tokens. Registering and signing in stay
        separate acts: a client that only wanted an account is not handed a
        credential it has to decide what to do with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: The account was created.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: |
            The email is already registered — `EMAIL_ALREADY_REGISTERED`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [EMAIL_ALREADY_REGISTERED]
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a session
      description: |
        Answers with the token pair and the person behind it, so a client renders
        a header without a second call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: The session was opened.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            The email and password do not match an account —
            `INVALID_CREDENTIALS`. Which half was wrong is deliberately not said.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [INVALID_CREDENTIALS]
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Exchange a refresh token for a new pair
      description: |
        The presented token is spent and a successor is issued. Do not retry this
        call: the token it spends is gone, and presenting it a second time is
        indistinguishable from the theft that rotation exists to detect — the
        answer is to end the whole chain and sign in again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: A new pair was issued and the old token is now spent.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokensResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            The token was expired, revoked, already spent, or never issued —
            `REFRESH_TOKEN_INVALID` for all four, since telling them apart would
            let a holder of one string find out whether it was ever real. Sign in
            again rather than retrying.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [REFRESH_TOKEN_INVALID]
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: End a session
      description: |
        Revokes the presented token's whole rotation chain. It succeeds for a
        token that was already revoked, never issued, or expired: logging out is
        a state the caller wants to reach rather than a change they are making.

        It does not invalidate the access token already in the caller's hands,
        which keeps working until it expires. A screen that must stop responding
        immediately has to ask the service that owns it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: The chain is revoked. No body.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/me:
    get:
      operationId: getCurrentUser
      tags: [account]
      summary: The signed-in person
      description: |
        The account is the one the presented token names. There is no endpoint
        that reads somebody else's, and no parameter here that could ask for one.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: The account behind the token.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: |
            The token is valid but names an account that no longer exists —
            `USER_NOT_FOUND`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [USER_NOT_FOUND]
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/products:
    get:
      operationId: listProducts
      tags: [storefront]
      summary: One page of the catalog, as a grid of cards
      description: |
        Anonymous: browsing is what a shopper does before deciding to have an
        account.

        Only products on sale are returned, and there is no parameter that can
        ask for anything else — drafts and archived products are an admin
        console's business, not this API's. A query parameter this endpoint does
        not name is ignored rather than rejected, so a campaign link carrying its
        own tracking parameters is still a valid request.
      parameters:
        - name: category
          in: query
          required: false
          description: Exact match on a category slug. Every category when absent.
          schema:
            type: string
            maxLength: 64
          example: clothing/shirts
        - name: pageSize
          in: query
          required: false
          description: |
            How many cards to return. Omit it, or send 0, to let the catalog
            choose.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 100
        - name: pageToken
          in: query
          required: false
          description: |
            The `nextPageToken` from the previous response. Opaque: read nothing
            from it and construct nothing into it.
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: One page. An empty page is an empty array, never null.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/products/{id}:
    get:
      operationId: getProduct
      tags: [storefront]
      summary: One product, as its own page
      description: |
        Anonymous, for the reason the listing is.

        Only published products are answered for. A draft, an archived product,
        and an id nobody ever minted are all `404 PRODUCT_NOT_FOUND`, and the
        three are deliberately indistinguishable — otherwise the status code
        alone would tell anyone walking UUIDs which ones name an unreleased
        product.

        Availability is the one optional part of this page. When the warehouse
        does not answer, every variant's `availableQuantity` is `null` and
        nothing else about the response changes; a client that renders `null` as
        "sold out" is wrong in the direction that costs a sale.
      parameters:
        - name: id
          in: path
          required: true
          description: The product's id, as `products.id` from the listing.
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
      responses:
        '200':
          description: The product, with every way it can be bought.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: |
            No product on sale under this id — `PRODUCT_NOT_FOUND`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [PRODUCT_NOT_FOUND]
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/checkout:
    post:
      operationId: checkout
      tags: [orders]
      summary: Place an order
      description: |
        Reserves the stock, records the order, and returns — it does not wait
        for the purchase to complete. The order comes back `pendingPayment`
        with the stock already held for it, and the rest of the flow happens
        behind the API.

        Prices are not in the request and cannot be. What each line costs is
        read from the catalog at this moment and frozen onto the order, so the
        total in the response is the agreement; a later price change does not
        rewrite it.

        `idempotencyKey` is required and is what makes a retry safe. The same
        key with the same lines replays the first order rather than placing a
        second; the same key with different lines is `409
        IDEMPOTENCY_KEY_REUSED`, because that is a client bug and not a retry.
        Generate one per attempt the shopper makes, not one per HTTP request.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: The order, waiting for payment.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: |
            The cart cannot be turned into an order as it stands.

            `OUT_OF_STOCK` names the SKU in `error.metadata.sku`: there is not
            enough of it to hold. `SKU_NOT_SELLABLE` is a line the catalog will
            not price — withdrawn, or never on sale. `IDEMPOTENCY_KEY_REUSED`
            is the same key sent with different lines.

            All three are worth showing the shopper differently, which is why
            they are separate codes behind one status.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [OUT_OF_STOCK, SKU_NOT_SELLABLE, IDEMPOTENCY_KEY_REUSED]
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: The signed-in person's order history, newest first
      description: |
        The caller's own orders and nobody else's. There is no parameter here
        that could ask for another account's, in the same way `/api/v1/me` has
        none.
      security:
        - bearerAuth: []
      parameters:
        - name: pageSize
          in: query
          required: false
          description: How many orders to return. Omitted or 0 leaves it to the service.
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 100
        - name: pageToken
          in: query
          required: false
          description: |
            `nextPageToken` from the previous response. Opaque — it is a cursor
            and not an offset, so orders placed while a customer pages are
            neither skipped nor repeated.
          schema:
            type: string
            maxLength: 512
      responses:
        '200':
          description: One page of orders.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: One order, as its own page
      description: |
        An order that belongs to somebody else answers `404 ORDER_NOT_FOUND`,
        exactly as an id nobody minted does. The two are deliberately
        indistinguishable: confirming that an order exists but is not yours is
        a fact about another customer.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The order's id, as `orders.id` from the history or from checkout.
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
      responses:
        '200':
          description: The order.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: |
            No order of the caller's under this id — `ORDER_NOT_FOUND`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [ORDER_NOT_FOUND]
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/orders/{id}/payment:
    post:
      operationId: startPayment
      tags: [payments]
      summary: Start paying for an order
      description: |
        Tells the provider about the money and returns as soon as it has been
        told — it does not wait for the money to arrive. A card that needs a
        3-D Secure page comes back `pending` with `nextActionUrl`; send the
        customer there. The outcome reaches the order a moment later, so poll
        `GET /api/v1/orders/{id}` rather than holding this request open.

        The amount is not in the request and cannot be. What the order costs is
        read from the order itself, so a client that could name its own amount
        would be naming what it pays.

        A declined card is a `201` carrying a `failed` attempt, not an error:
        nothing about the request was wrong, the order stays `pendingPayment`,
        and the customer may try again with a new `idempotencyKey` until the
        hold on their stock expires. Only running out of time cancels an order.

        `idempotencyKey` deduplicates the submit and not the order. The same key
        replays the first attempt; a fresh key is a fresh attempt.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The order to collect for, as `order.id` from checkout.
          schema:
            type: string
            format: uuid
            pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPaymentRequest'
      responses:
        '201':
          description: |
            The attempt, in whatever state the provider left it — `pending` with
            somewhere to send the customer, `succeeded`, or `failed`.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          description: |
            No order of the caller's under this id — `ORDER_NOT_FOUND`, exactly
            as `GET /api/v1/orders/{id}` answers it.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [ORDER_NOT_FOUND]
        '409':
          description: |
            The order cannot be paid for as it stands.

            `ORDER_NOT_PAYABLE` — already paid, or cancelled; the order's own
            `status` says which. `PAYMENT_ALREADY_IN_FLIGHT` — an attempt against
            this order is still unresolved, which is what a double-clicked
            button produces; wait for it rather than starting another.
            `IDEMPOTENCY_KEY_REUSED` — the same key sent for a different order,
            which is a client bug and not a retry.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - ORDER_NOT_PAYABLE
                              - PAYMENT_ALREADY_IN_FLIGHT
                              - IDEMPOTENCY_KEY_REUSED
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          description: |
            Something broke, and the provider is one of the things it could have
            been: `PROVIDER_UNAVAILABLE` is a call that did not complete —
            possibly after the money moved, which is why the attempt is kept and
            reconciled rather than guessed at — and `PROVIDER_REJECTED` and
            `PROVIDER_MALFORMED` are an integration bug on this side.

            All of them mean the same thing to a client as `INTERNAL` does:
            nothing it sent was wrong. Do not retry with the same key expecting
            a different answer; read the order back instead.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - INTERNAL
                              - UNKNOWN
                              - DATA_LOSS
                              - PROVIDER_UNAVAILABLE
                              - PROVIDER_REJECTED
                              - PROVIDER_MALFORMED
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

  /api/v1/webhooks/payment:
    post:
      operationId: handlePaymentWebhook
      tags: [payments]
      summary: A payment provider's callback
      description: |
        Not for storefront clients. It is here because a webhook is north-south
        traffic like everything else, and this is the only thing in the system
        that speaks HTTP.

        No token, and none would help: the caller is not a person. What
        authenticates the request is `X-Provider-Signature`, an HMAC over the
        body, checked by the service that holds the secret — a stronger claim
        than a forwarded user id, since it says who wrote the bytes rather than
        who relayed them.

        The body is whatever the provider sends and is passed on untouched. It
        is described here as an open object for that reason: this tier does not
        parse it, and a schema naming its fields would be this API claiming a
        shape it neither owns nor checks.

        Idempotent, because providers redeliver. A callback naming an attempt
        this system does not have is accepted and changes nothing — answering
        404 would make the provider retry it forever.
      parameters:
        - name: X-Provider-Signature
          in: header
          required: true
          description: |
            The provider's signature over the body exactly as sent. Computed
            over the bytes, so anything that re-encodes the JSON on the way here
            invalidates it.
          schema:
            type: string
            minLength: 1
            maxLength: 1024
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: The provider's own event body, forwarded byte for byte.
              additionalProperties: true
      responses:
        '204':
          description: |
            The callback was taken. No body: a provider has no use for one, and
            what it needs is the 2xx that stops the retries.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
        '400':
          description: |
            The request could not be read — the shared decode codes, plus
            `CALLBACK_MALFORMED` for a signed body that verifies and then names
            nothing this system recognises.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum:
                              - INVALID_INPUT
                              - MALFORMED_JSON
                              - EMPTY_BODY
                              - CALLBACK_MALFORMED
        '401':
          description: |
            The signature does not verify — `CALLBACK_SIGNATURE_INVALID`. The
            body is not a fact about anything and nothing was changed.
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationID'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - properties:
                      error:
                        properties:
                          code:
                            enum: [CALLBACK_SIGNATURE_INVALID]
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/UpstreamUnavailable'
        '504':
          $ref: '#/components/responses/UpstreamTimeout'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The access token from `POST /api/v1/auth/login`, as
        `Authorization: Bearer <token>`. It is an ES256 JWT and lives 15 minutes;
        renew it with `POST /api/v1/auth/refresh` rather than signing in again.

        `X-User-ID` and `X-User-Roles` are ignored wherever they appear. Identity
        comes from the signature this service verified itself.

  headers:
    CorrelationID:
      description: |
        The ID tying this response to every log line and span behind it. Present
        on every answer, this API's and the gateway's alike.
      schema:
        type: string

  responses:
    BadRequest:
      description: |
        The request could not be read or broke a rule.

        A body that will not decode is a bug in the client and carries a reason
        code with no translated prose: `EMPTY_BODY`, `MALFORMED_JSON`,
        `UNKNOWN_FIELD`, `INVALID_FIELD_TYPE`. A request that decodes but breaks
        a rule is a person's mistake and comes back as `INVALID_INPUT` with
        `error.fields`, one entry per failing field, each already translated.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
        Content-Language:
          description: The language `error.fields[].message` was written in.
          schema:
            type: string
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        enum:
                          - INVALID_INPUT
                          - MALFORMED_JSON
                          - EMPTY_BODY
                          - UNKNOWN_FIELD
                          - INVALID_FIELD_TYPE

    Unauthenticated:
      description: |
        No usable token was presented — `TOKEN_MISSING`, `TOKEN_EXPIRED`, or
        `TOKEN_INVALID`, and nothing finer, so that probing signatures teaches
        nothing.

        `TOKEN_EXPIRED` is the only one to act on differently: refresh, do not
        send the person back to a login screen.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        enum: [TOKEN_MISSING, TOKEN_EXPIRED, TOKEN_INVALID]

    PayloadTooLarge:
      description: |
        The body is over 1 MiB — `BODY_TOO_LARGE`. A body large enough to be
        refused by the gateway instead arrives without an `error.code`.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        enum: [BODY_TOO_LARGE]

    UnsupportedMediaType:
      description: |
        A `Content-Type` other than `application/json` was sent —
        `UNSUPPORTED_MEDIA_TYPE`. Sending none at all is allowed.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        enum: [UNSUPPORTED_MEDIA_TYPE]

    InternalError:
      description: |
        Something here broke — `INTERNAL`, or `UNKNOWN` and `DATA_LOSS` for a
        failure that could not even say that much. All three mean the same thing
        to a client: nothing it sent was wrong and nothing it can change will
        help. The message is fixed prose and the detail is in the logs under
        this response's correlation ID.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        enum: [INTERNAL, UNKNOWN, DATA_LOSS]

    UpstreamUnavailable:
      description: |
        A service this endpoint depends on could not be reached — `UNAVAILABLE`.

        A 503 with no `error.code` at all came from the gateway instead, and
        means this service is the one that could not be reached. Both are
        `UPSTREAM_UNAVAILABLE` as far as a client's handling goes.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        enum: [UNAVAILABLE]

    UpstreamTimeout:
      description: |
        A service this endpoint depends on did not answer inside the request's
        budget — `DEADLINE_EXCEEDED`. Retrying is reasonable; retrying
        immediately is not.
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/CorrelationID'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponse'
              - properties:
                  error:
                    properties:
                      code:
                        enum: [DEADLINE_EXCEEDED]

  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Bounded at the longest address SMTP is required to accept.
        password:
          type: string
          minLength: 8
          maxLength: 256
          description: |
            Length is all that is checked. Composition rules push people toward
            predictable passwords and belong nowhere near a transport contract.
      example:
        email: ada@example.com
        password: correct-horse-battery-staple

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 256
          description: |
            No minimum beyond one character, unlike registration: the rule to
            satisfy here is whatever the password already is, and a policy
            tightened afterwards must not lock anyone out of an account they can
            still open.

    RefreshTokenRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 512
          description: |
            In the body and never in a header. The `Authorization` header rides
            every request to every service, which is the right place for a
            15-minute access token and the wrong place for the long-lived
            credential that mints new ones.

    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 512

    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, roles, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        roles:
          type: array
          description: |
            Empty rather than null for a person with none, so a client needs no
            nil check to iterate it.
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SessionResponse:
      type: object
      required: [tokens, user]
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'
        user:
          $ref: '#/components/schemas/User'

    TokensResponse:
      type: object
      description: |
        What a refresh answers with: the pair alone, because nothing about the
        account has changed.
      required: [tokens]
      properties:
        tokens:
          $ref: '#/components/schemas/TokenPair'

    TokenPair:
      type: object
      required:
        [accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
          description: |
            An ES256 JWT, sent back as the bearer token in the `Authorization`
            header.
        refreshToken:
          type: string
          description: |
            Opaque, and revocable precisely because it is not a JWT. Store it
            where an access token would not go.
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: |
            The end of the whole rotation chain, not of this link. Refreshing
            does not move it.

    ProductsResponse:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductCard'
        nextPageToken:
          type: string
          description: |
            Absent on the last page. Send it back as `pageToken` to ask for the
            next one.

    ProductCard:
      type: object
      description: |
        One product as a grid of cards needs it, which is much less than the
        catalog holds about it. The description and the variant list are
        deliberately absent: twenty cards would carry twenty descriptions and
        every SKU to render text no card shows.
      required: [id, name, category, priceFrom, variantCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        priceFrom:
          description: |
            The cheapest variant's price, which is what "from ฿x" on a card
            quotes. Null for a product with no variants — a state the storefront
            should never see, since publishing requires one.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        variantCount:
          type: integer
          description: |
            How many ways this product can be bought, so a card knows whether
            `priceFrom` is the price or the lowest of several.

    ProductResponse:
      type: object
      required: [product]
      properties:
        product:
          $ref: '#/components/schemas/ProductDetail'

    ProductDetail:
      type: object
      description: |
        One product as its own page needs it, which is everything a card leaves
        out: the words, and every way the thing can be bought.

        There is no status field. Only published products are ever returned
        here, so it would carry the same value on every response.
      required: [id, name, description, category, variants]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
        variants:
          type: array
          description: |
            Never empty for a published product — publishing requires one.
          items:
            $ref: '#/components/schemas/ProductVariant'

    ProductVariant:
      type: object
      description: |
        One buyable unit: what it costs, what distinguishes it from its
        siblings, and whether there is one left.
      required: [id, sku, price, attributes, availableQuantity]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          description: |
            What the warehouse, a picking list, and a supplier's invoice all
            call this thing. Uppercase, and stable.
          example: SHIRT-OX-M
        price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: |
            Null for a variant the catalog holds no price for — a state a
            published product should not be in, and one a zero would describe
            wrongly.
        attributes:
          type: object
          description: |
            Whatever the catalog was told distinguishes this variant. Opaque:
            read a key only if you put it there. `{}` when there are none.
          additionalProperties:
            type: string
          example:
            size: M
        availableQuantity:
          description: |
            How many may still be bought. `0` means the warehouse has none;
            `null` means it did not answer and nobody knows — render the two
            differently, because treating `null` as sold out hides a product
            that is on the shelf.

            It is the count and not a flag: whether to say "only 3 left" or just
            "in stock" is the client's to decide, and any rule about what a
            shopper may learn belongs to the service that owns the number.
          oneOf:
            - type: integer
              format: int32
              minimum: 0
            - type: 'null'

    CheckoutRequest:
      type: object
      description: A cart being turned into an order.
      required: [idempotencyKey, lines]
      properties:
        idempotencyKey:
          type: string
          description: |
            The client's own key for this attempt, repeated on every retry of
            it. One per attempt the shopper makes — a fresh key on each HTTP
            retry would defeat the deduplication entirely.
          minLength: 8
          maxLength: 128
          example: checkout-4f2b1c8a
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/CheckoutLine'

    CheckoutLine:
      type: object
      description: One SKU and how many of it. No price — that is the catalog's answer.
      required: [sku, quantity]
      properties:
        sku:
          type: string
          maxLength: 64
          example: SHIRT-BLUE-M
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 10000

    OrderResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/Order'

    OrdersResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        nextPageToken:
          type: string
          description: Absent on the last page. Send it back as `pageToken`.

    Order:
      type: object
      description: |
        One purchase. How the stock is held while it is paid for is not
        described here on purpose: that is machinery, and a client that read it
        would be a client the flow cannot be changed underneath.
      required: [id, status, lines, total, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          description: |
            `pendingPayment` — recorded, stock held, waiting for money.
            `paid` — the money is in.
            `cancelled` — it will not proceed and the stock has gone back.

            Branch on the values you know and render anything else as in
            progress: a status a newer release added must not break a screen.
          enum: [pendingPayment, paid, cancelled, unknown]
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        total:
          $ref: '#/components/schemas/Money'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderLine:
      type: object
      required: [sku, quantity, unitPrice]
      properties:
        sku:
          type: string
        quantity:
          type: integer
          format: int32
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            What was agreed for one at the moment of checkout, not what the
            catalog charges now.

    StartPaymentRequest:
      type: object
      description: One attempt to collect for an order.
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey:
          type: string
          description: |
            The client's own key for this attempt, repeated on every retry of
            it. One per attempt the shopper makes — a fresh key on each HTTP
            retry would defeat the deduplication entirely, and here that means a
            second charge.
          minLength: 8
          maxLength: 128
          example: pay-4f2b1c8a
        method:
          type: string
          description: |
            How the customer chose to pay, in this system's vocabulary rather
            than a provider's — `card`, `promptpay`. Omitted leaves it to the
            provider's default, which is what a hosted checkout page decides for
            itself.

            Deliberately not an enum: which methods are on offer is a question
            about the shop and the provider it has signed with, and a closed set
            here would make every new method a change to this contract. Lowercase
            letters, digits, and underscores, starting with a letter; a name
            outside that is refused by the payment service as `INVALID_INPUT`.
          maxLength: 32
          example: promptpay

    PaymentResponse:
      type: object
      required: [payment]
      properties:
        payment:
          $ref: '#/components/schemas/Payment'
        nextActionUrl:
          type: string
          format: uri
          description: |
            Where to send the customer to finish paying — a 3-D Secure page, a
            hosted form, a QR code. Absent when there is nothing for them to do
            and the answer is simply on its way.

            On the response rather than on the payment because that is what it
            is: a fact about this answer. It expires, and a URL that authorises a
            charge is not something to hand back on every later read.

    Payment:
      type: object
      description: |
        One attempt to collect for an order. There may be several against the
        same order — a declined card is a finished attempt, and trying again is
        a new one.

        The provider's reference and its failure reason are deliberately not
        here. Both are written in the provider's vocabulary for whoever operates
        the integration, and rendering either to a shopper would bind this API
        to a set of strings the provider changes without telling anyone.
      required: [id, orderId, status, amount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          description: |
            `pending` — the provider has been told; the customer may still have
            something to do, or the answer may simply not be back.
            `succeeded` — the money is in, and the order becomes `paid` shortly
            after.
            `failed` — this attempt is over and no money moved. The order is
            not: start another attempt with a new `idempotencyKey`.

            Branch on the values you know and render anything else as in
            progress.
          enum: [pending, succeeded, failed, unknown]
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: |
            What was sent to the provider, copied from the order when the attempt
            started rather than read back now — so it stays readable next to what
            the provider says it charged.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Money:
      type: object
      description: |
        An amount in a currency's minor unit — 1050 is THB 10.50 — with the
        currency saying how many decimal places that is. Formatting is the
        client's: the locale an amount is rendered in is the browser's, not this
        API's.
      required: [amountMinor, currencyCode]
      properties:
        amountMinor:
          type: integer
          format: int64
        currencyCode:
          type: string
          description: ISO 4217.
          minLength: 3
          maxLength: 3
      example:
        amountMinor: 89000
        currencyCode: THB

    ErrorResponse:
      type: object
      description: The body behind every failure this API decided on.
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            The machine-stable reason to branch on, finer-grained than the HTTP
            status on purpose. Renaming one is a breaking change.

            A failure raised below the handlers — a refused connection, a
            tripped breaker, a spent deadline — has no reason of its own, and
            the name of the status it arrived as stands in: `UNAVAILABLE`,
            `DEADLINE_EXCEEDED`. Every response below lists the codes it can
            carry.
          examples:
            - EMAIL_ALREADY_REGISTERED
            - INVALID_CREDENTIALS
            - TOKEN_EXPIRED
            - INVALID_INPUT
        message:
          type: string
          description: |
            English prose, for a developer reading a log or a network tab. Never
            render it to a user: it is untranslated, and a 5xx replaces it with
            fixed text anyway so that nothing internal leaks.
        fields:
          type: array
          description: Set when the request broke per-field validation.
          items:
            $ref: '#/components/schemas/FieldError'
        metadata:
          type: object
          description: |
            The facts behind `code` — the SKU that was short, the status an order
            was actually in — so a client can compose its own message without
            parsing one.
          additionalProperties:
            type: string
        correlationId:
          type: string
          description: |
            Present when this service wrote the body. Prefer the
            `X-Correlation-ID` header, which is on every answer including the
            gateway's.

    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: |
            The path as the client wrote it, in the same camelCase the request
            used, with indexes for collections — `items[0].quantity`.
          examples: [pageSize, email]
        code:
          type: string
          description: The rule that failed, for a client that wants its own wording.
          examples: [required, email, lte]
        message:
          type: string
          description: |
            The failure in the language `Accept-Language` asked for, ready to
            render next to the input. The only translated string in this API.
